[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-secrets-manager-connector"
version = "1.0.0"
description = "Conector Ruvic de lectura de secretos gestionados en AWS Secrets Manager"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34,<2.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_secrets_manager_connector*"]
